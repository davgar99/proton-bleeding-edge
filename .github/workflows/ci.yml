name: CI

on:
  push:
    branches:
      - main
      - "routine-test-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.7

      - name: Ruff lint
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q main.py build_config.py test_main.py test_build_config.py test_repository_identity.py

      - name: Run unit tests
        run: python -m unittest -v
